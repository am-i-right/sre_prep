services:
  nginx:
    image: nginx:stable-alpine

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - frontend

    restart: unless-stopped

  app:
    build:
      context: ./app

    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    expose:
      - "8000"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    networks:
      - frontend
      - backend

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - backend

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d

    networks:
      - frontend

    restart: unless-stopped

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true

volumes:
  redis_data:
  prometheus_data:

