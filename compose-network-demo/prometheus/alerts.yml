groups:
  - name: flask-sre-alerts
    interval: 5s

    rules:

      # 1. Prometheus cannot scrape Flask
      - alert: FlaskAppDown
        expr: up{job="flask-app"} == 0
        for: 20s

        labels:
          severity: critical
          service: flask-app

        annotations:
          summary: "Flask application is unavailable"
          description: "Prometheus cannot scrape app:8000/metrics"


      # 2. More than 10% of user requests return 5xx
      - alert: HighHttpErrorRate
        expr: |
          (
            (
              sum(
                rate(
                  app_http_errors_total{
                    route!~"/(health|ready)"
                  }[1m]
                )
              ) or vector(0)
            )
            /
            clamp_min(
              sum(
                rate(
                  app_http_requests_total{
                    route!~"/(health|ready)"
                  }[1m]
                )
              ),
              1e-9
            )
          ) > 0.10
          and
          sum(
            rate(
              app_http_requests_total{
                route!~"/(health|ready)"
              }[1m]
            )
          ) > 0.2

        for: 30s

        labels:
          severity: warning
          service: flask-app

        annotations:
          summary: "HTTP 5xx error rate is above 10%"
          description: "User-facing HTTP requests are failing"


      # 3. p95 latency exceeds 500 milliseconds
      - alert: HighHttpLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(
                app_http_request_duration_seconds_bucket{
                  route!~"/(health|ready)"
                }[1m]
              )
            )
          ) > 0.5
          and
          sum(
            rate(
              app_http_request_duration_seconds_count{
                route!~"/(health|ready)"
              }[1m]
            )
          ) > 0.2

        for: 30s

        labels:
          severity: warning
          service: flask-app

        annotations:
          summary: "HTTP p95 latency exceeds 500 ms"
          description: "The application is responding slowly"

