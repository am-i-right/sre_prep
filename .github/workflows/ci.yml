name: SRE CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python with pip cache
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            compose-network-demo/app/requirements.txt
            compose-network-demo/app/requirements-dev.txt

      - name: Install dependencies
        working-directory: compose-network-demo/app
        run: |
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Run tests
        working-directory: compose-network-demo/app
        run: |
          python -m pytest -q \
            --junitxml=pytest-results.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: compose-network-demo/app/pytest-results.xml
          if-no-files-found: warn
          retention-days: 7

  docker-build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image with cache
        uses: docker/build-push-action@v7
        with:
          context: ./compose-network-demo/app
          push: false
          tags: sre-app:ci
          cache-from: type=gha,scope=sre-app
          cache-to: type=gha,mode=max,scope=sre-app

